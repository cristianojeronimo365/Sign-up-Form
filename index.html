<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Document</title>
</head>
<body>
        <div class="child-left">
            <div class="div-logo">
                <img src="./imgs/odin-lined.png" alt="image failure">
                <h1 id="h1-logo">ODIN</h1>
            </div>
            <p class="line-bottom">Photo by <a href="https://unsplash.com/pt-br/@tcteraytay">Toffi Teraytay</a> on <a href="https://unsplash.com/">Unsplash</a></p>
        </div>
        <div class="child-right">
            <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. <br> Sign up now to get started. </p>
            <p>You know you want to.</p>
            <form action="#" method="post">
                <fieldset>
                    <h2>Let's do this!</h2>
                    <div class="double-lines">
                        <div class="camps">
                            <label for="first_name">FIRST NAME</label>
                            <input type="text" name="first_name" id="first_name">
                        </div>
                        <div class="camps">
                            <label for="last_name">LAST NAME</label>
                            <input type="text" name="last_name" id="last_name">
                        </div>
                    </div>

                    <div class="double-lines">
                        <div class="camps">
                            <label for="email">E-MAIL</label>
                            <input type="text" name="email" id="email">
                        </div>
                        <div class="camps">
                            <label for="phone_number">PHONE NUMBER</label>
                            <input type="text" name="phone_number" id="phone_number">
                        </div>
                    </div>

                    <div class="double-lines">
                        <div class="camps">
                            <label for="password">PASSWORD</label>
                            <input type="text" name="password" id="password">
                        </div>
                        <div class="camps">
                            <label for="confirm_password">CONFIRM PASSWORD</label>
                            <input type="text" name="confirm_password" id="confirm_password">
                        </div>
                    </div>
                </fieldset>
                <br>
                <input type="submit" value="Create Account">
                <p class="line-bottom2">Already have a account? <a href="http://login.com" target="_self" rel="noopener noreferrer">Log in</a></p>
            </form>
        </div>
</body>
</html>
